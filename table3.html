<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h3 style="text-align: center">Таблиця Модріана</h3>
    <!--Третя таблиця-->
    <table class="table3" width="500px" height="440px">
      <tr>
        <td colspan="2" height="25px"></td>
        <td colspan="2"></td>
        <td class="yellow" colspan="2"></td>
        <td rowspan="5" width="2"></td>
      </tr>
      <tr>
        <td rowspan="2" height="80px" width="30px"></td>
        <td class="red" rowspan="3" colspan="3" width="30px"></td>
        <td class="yellow" colspan="2" height="90px"></td>
      </tr>
      <tr>
        <td rowspan="2"></td>
        <td rowspan="2"></td>
      </tr>
      <tr>
        <td rowspan="2"></td>
      </tr>
      <tr>
        <td class="black" colspan="2" rowspan="2"></td>
        <td height="35px"></td>
        <td colspan="2"></td>
      </tr>
      <tr>
        <td class="yellow" rowspan="3"></td>
        <td height="35px"></td>
        <td class="blue" colspan="2" rowspan="2"></td>
        <td class="red" rowspan="3"></td>
      </tr>
      <tr>
        <td colspan="2" rowspan="2"></td>
        <td class="black" height="10px"></td>
      </tr>
      <tr>
        <td colspan="3" height="1px"></td>
      </tr>
    </table>
    <br />

      >Завдання 1</a
    >

    <a href="table3.html" style="text-decoration: none; padding-right: 6px"
      >Завдання 3</a
    >
  </body>
</html>
